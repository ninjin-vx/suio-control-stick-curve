<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101214">
<title>SuiOvOi Control スティックカーブ</title>
<meta name="description" content="SuiOvOi Control用 左右スティックカーブ計算ツール">
<style>
:root{--bg:#0b0d0f;--p:#14171a;--p2:#101316;--b:#2a3036;--t:#f2f4f6;--m:#8f989f;--a:#f28a3c;--g:#e5b544}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t)}body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK JP",monospace}.wrap{width:min(1160px,calc(100% - 24px));margin:auto;padding:28px 0 40px}h1{font-family:system-ui,sans-serif;margin:6px 0;font-size:clamp(27px,4vw,42px);letter-spacing:-.04em}.ey{color:var(--a);font-size:12px;font-weight:800;letter-spacing:.12em}.sub{color:var(--m);font-size:13px;line-height:1.6}.tabs{display:flex;gap:7px;width:max-content;max-width:100%;padding:5px;margin:18px 0 16px;border:1px solid var(--b);border-radius:12px;background:var(--p2)}.tab{min-width:138px;height:42px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--m);font-weight:900;cursor:pointer}.tab.on{color:var(--t);border-color:#f28a3c66;background:#f28a3c1c}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.card{background:linear-gradient(#171a1d,#121518);border:1px solid var(--b);border-radius:16px}.chart{padding:14px}.head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:12px;color:var(--m)}.head b{color:var(--a)}.cw{aspect-ratio:1.45/1;min-height:420px;border:1px solid var(--b);border-radius:12px;background:#111416;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.side{display:grid;gap:14px}.ctrl,.res{padding:14px}.group{margin-bottom:14px}.lab{font-size:12px;color:var(--m);margin-bottom:7px}.pair{display:grid;grid-template-columns:82px 1fr;gap:8px}.fixed,.box{height:44px;border:1px solid var(--b);border-radius:9px;background:#0f1214;display:flex;align-items:center}.fixed{padding:0 10px;color:#aeb6bd;font-size:12px}.box{border-color:#f28a3c88}.box span{padding-left:10px;color:#aeb6bd;font-size:12px}.box input{width:100%;height:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--g);font-weight:900;text-align:right;padding:0 10px;font-size:16px}.range{width:100%;accent-color:var(--a)}.hint,.note{color:#707a82;font-size:11px;line-height:1.55}.hint b{color:var(--a)}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center}.pt{font-weight:900;font-size:13px}.v{height:38px;border:1px solid var(--b);border-radius:8px;background:#0f1214;display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:var(--m);font-size:12px}.v strong{color:var(--g);font-size:13px}.hot .pt{color:var(--a)}.hot .v{border-color:#f28a3c66}.fixedrow{opacity:.82}.fixedrow .v strong{color:#d7dde1}.hide{display:none}.rt{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:10px}.note{margin-top:10px}@media(max-width:820px){.layout{grid-template-columns:1fr}.cw{min-height:340px}}@media(max-width:520px){.wrap{width:calc(100% - 14px);padding-top:18px}.tabs{width:100%}.tab{min-width:0;flex:1}.chart{padding:8px}.cw{min-height:310px;aspect-ratio:1/1}.pair{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="ey">STICK CURVE TOOL</div><h1>SuiOvOi Control スティックカーブ</h1><div class="sub">左・右スティックをタブで切り替え。設定値と最後に開いたタブはブラウザに自動保存されます。</div>
<nav class="tabs"><button id="tl" class="tab on">左スティック</button><button id="tr" class="tab">右スティック</button></nav>
<div class="layout"><section class="card chart"><div class="head"><span>X / Y AXIS · 0–100</span><b id="modeText"></b></div><div class="cw"><canvas id="c"></canvas></div></section>
<aside class="side"><section class="card ctrl">
<div id="lc"><div class="group"><div class="lab">アンチデッドゾーン / START Y</div><div class="pair"><div class="fixed">X&nbsp; 0.0</div><label class="box"><span>Y</span><input id="sy" type="number" min="0" max="99.9" step="0.1"></label></div></div><div class="group"><div class="lab">P10 の X 値</div><input id="xr" class="range" type="range" min="10" max="100" step="0.1"><div class="pair"><div class="fixed">Y&nbsp; 100.0</div><label class="box"><span>X</span><input id="px" type="number" min="10" max="100" step="0.1"></label></div></div><div class="hint"><b>STARTを上下ドラッグ</b>＝アンチデッドゾーン、<b>P10を左右ドラッグ</b>＝P10 X。P1〜P9は10等分で自動計算。</div></div>
<div id="rc" class="hide"><div class="group"><div class="lab">P9 の Y 値</div><div class="pair"><div class="fixed">X&nbsp; 99.8</div><label class="box"><span>Y</span><input id="ry" type="number" min="0" max="100" step="0.1"></label></div></div><div class="hint">数値入力またはグラフ上の <b>P9を上下ドラッグ</b>でP1〜P9を再計算。</div></div>
</section><section class="card res"><div class="rt"><span>計算結果</span><span id="resultMode"></span></div><div id="rows" class="rows"></div><div id="note" class="note"></div></section></aside></div></div>
<script>
(()=>{const $=s=>document.getElementById(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),f=v=>Number(v).toFixed(1),K='suio-control-stick-curve-settings-v1';let S={leftStartY:11,leftP10X:50,rightP9Y:53.5,activeTab:'left'};try{S={...S,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){};const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};let mode=S.activeTab==='right'?'right':'left',drag='';const C=$('c'),x=C.getContext('2d'),tl=$('tl'),tr=$('tr'),lc=$('lc'),rc=$('rc'),sy=$('sy'),px=$('px'),xr=$('xr'),ry=$('ry'),rows=$('rows');
function geo(){let r=C.getBoundingClientRect(),W=Math.max(360,Math.round(r.width)),H=Math.max(300,Math.round(r.height)),p={l:58,r:42,t:36,b:52},cw=W-p.l-p.r,ch=H-p.t-p.b;return{r,W,H,p,cw,ch,X:v=>p.l+v/100*cw,Y:v=>p.t+ch-v/100*ch}}function prep(){let d=Math.max(1,devicePixelRatio||1),g=geo();C.width=g.W*d;C.height=g.H*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,g.W,g.H);return g}function axes(g){x.lineWidth=1;x.strokeStyle='#24292e';x.fillStyle='#7f878e';x.font='12px monospace';x.textAlign='center';x.textBaseline='top';for(let v=0;v<=100;v+=20){x.beginPath();x.moveTo(g.X(v),g.Y(0));x.lineTo(g.X(v),g.Y(100));x.stroke();x.fillText(v,g.X(v),g.Y(0)+12)}x.textAlign='right';x.textBaseline='middle';for(let v=0;v<=100;v+=20){x.beginPath();x.moveTo(g.X(0),g.Y(v));x.lineTo(g.X(100),g.Y(v));x.stroke();x.fillText(v,g.X(0)-12,g.Y(v))}x.strokeStyle='#626970';x.lineWidth=2;x.beginPath();x.moveTo(g.X(0),g.Y(0));x.lineTo(g.X(100),g.Y(0));x.stroke();x.beginPath();x.moveTo(g.X(0),g.Y(0));x.lineTo(g.X(0),g.Y(100));x.stroke()}function dot(g,a,b,l,opt={}){let X=g.X(a),Y=g.Y(b);x.beginPath();x.arc(X,Y,opt.r||8,0,Math.PI*2);x.fillStyle=opt.fill||'#e5b544';x.strokeStyle=opt.stroke||'#0b0d0f';x.lineWidth=opt.w||4;x.stroke();x.fill();if(l){x.fillStyle=opt.text||'#e7ebee';x.font='bold 13px monospace';x.textAlign=opt.align||'center';x.textBaseline=opt.base||'bottom';x.fillText(l,X+(opt.dx||0),Y+(opt.dy??-11))}}function rh(p,hot=false,fix=false){return `<div class="row${hot?' hot':''}${fix?' fixedrow':''}"><div class="pt">P${p.p}</div><div class="v"><span>X</span><strong>${f(p.x)}</strong></div><div class="v"><span>Y</span><strong>${f(p.y)}</strong></div></div>`}
function vals(){if(mode==='left'){S.leftStartY=cl(+S.leftStartY||0,0,99.9);S.leftP10X=cl(+S.leftP10X||50,10,100);let a=[];for(let i=1;i<=9;i++){let q=i/10;a.push({p:i,x:+(S.leftP10X*q).toFixed(1),y:+(S.leftStartY+(100-S.leftStartY)*q).toFixed(1)})}a.push({p:10,x:S.leftP10X,y:100});return a}let Y=cl(+S.rightP9Y||53.5,0,100),m=Y/99.8,a=[];for(let i=1;i<=9;i++){let X=i===9?99.8:+(99.8*i/9).toFixed(1);a.push({p:i,x:X,y:i===9?Y:+(X*m).toFixed(1)})}a.push({p:10,x:99.9,y:100});return a}
function draw(a){let g=prep();axes(g);x.strokeStyle='#f28a3c';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();if(mode==='left')x.moveTo(g.X(0),g.Y(S.leftStartY));else x.moveTo(g.X(0),g.Y(0));a.slice(0,mode==='left'?10:9).forEach(p=>x.lineTo(g.X(p.x),g.Y(p.y)));x.stroke();if(mode==='left'){dot(g,0,S.leftStartY,'START',{fill:'#111416',stroke:'#f28a3c',r:9,text:'#f28a3c',align:'left',dx:15,dy:4,base:'middle'});a.forEach(p=>dot(g,p.x,p.y,'P'+p.p,{stroke:p.p===10?'#f28a3c':'#0b0d0f',r:p.p===10?9:8,dy:p.p===10?20:-11,base:p.p===10?'top':'bottom'}))}else{x.strokeStyle='#7c858d';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(g.X(a[8].x),g.Y(a[8].y));x.lineTo(g.X(99.9),g.Y(100));x.stroke();x.setLineDash([]);a.slice(0,9).forEach(p=>dot(g,p.x,p.y,'P'+p.p,{dy:p.p===9?-13:-11}));dot(g,99.9,100,'P10',{fill:'#a9b0b6',text:'#dfe3e6',dy:13,base:'top'});dot(g,0,0,'',{fill:'#8e969d',r:7})}}
function update(){sy.value=f(S.leftStartY);px.value=f(S.leftP10X);xr.value=S.leftP10X;ry.value=f(S.rightP9Y);let a=vals();rows.innerHTML=a.map(p=>rh(p,mode==='left'?p.p===10:p.p===9,mode==='right'&&p.p===10)).join('');$('modeText').textContent=mode==='left'?'START Y + P10 X 可変 / P10 Y=100 固定':'P9 X=99.8 / P10=99.9,100 固定';$('resultMode').textContent=mode==='left'?'START → P10 LINEAR':'P1 → P9 LINEAR';$('note').textContent=mode==='left'?'START X=0固定。P10 Y=100固定、Xは10.0〜100.0。':'P1〜P9は原点からP9までの同一直線上。P10はX=99.9 / Y=100.0固定。';save();draw(a)}function tab(m){mode=m;S.activeTab=m;tl.classList.toggle('on',m==='left');tr.classList.toggle('on',m==='right');lc.classList.toggle('hide',m!=='left');rc.classList.toggle('hide',m!=='right');update()}tl.onclick=()=>tab('left');tr.onclick=()=>tab('right');
function pos(e){let g=geo();return{g,X:e.clientX-g.r.left,Y:e.clientY-g.r.top}}function near(e){let q=pos(e),g=q.g;if(mode==='left'){if(Math.hypot(q.X-g.X(0),q.Y-g.Y(S.leftStartY))<=26)return's';if(Math.hypot(q.X-g.X(S.leftP10X),q.Y-g.Y(100))<=26)return'p'}else if(Math.hypot(q.X-g.X(99.8),q.Y-g.Y(S.rightP9Y))<=26)return'r';return''}function move(e){let q=pos(e),g=q.g;if(drag==='s')S.leftStartY=Math.round(cl(((g.p.t+g.ch-q.Y)/g.ch)*100,0,99.9)*10)/10;if(drag==='p')S.leftP10X=Math.round(cl(((q.X-g.p.l)/g.cw)*100,10,100)*10)/10;if(drag==='r')S.rightP9Y=Math.round(cl(((g.p.t+g.ch-q.Y)/g.ch)*100,0,100)*10)/10;update()}C.onpointerdown=e=>{drag=near(e);if(!drag)return;C.setPointerCapture?.(e.pointerId);move(e);e.preventDefault()};C.onpointermove=e=>{if(drag){move(e);e.preventDefault()}else{let n=near(e);C.style.cursor=n==='p'?'ew-resize':n?'ns-resize':'default'}};C.onpointerup=C.onpointercancel=e=>{drag='';try{C.releasePointerCapture?.(e.pointerId)}catch(_){}};
sy.oninput=()=>{let v=+sy.value;if(Number.isFinite(v)){S.leftStartY=cl(v,0,99.9);update()}};px.oninput=()=>{let v=+px.value;if(Number.isFinite(v)){S.leftP10X=cl(v,10,100);update()}};xr.oninput=()=>{S.leftP10X=+xr.value;update()};ry.oninput=()=>{let v=+ry.value;if(Number.isFinite(v)){S.rightP9Y=cl(v,0,100);update()}};addEventListener('resize',update);tab(mode)})();
</script></body></html>
