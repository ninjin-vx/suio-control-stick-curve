<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101214" />
  <title>SuiOvOi Control スティックカーブ</title>
  <meta name="description" content="P9のY値だけを指定して、P1〜P9までの完全リニアなスティックカーブを自動計算します。P9 X=99.8、P10=99.9/100固定。" />
  <style>
    :root{
      --bg:#0b0d0f;
      --panel:#14171a;
      --panel2:#101316;
      --line:#2a3036;
      --grid:#24292e;
      --text:#f2f4f6;
      --muted:#8f989f;
      --accent:#f28a3c;
      --gold:#e5b544;
      --fixed:#6f7b86;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Noto Sans Mono CJK JP",monospace;
      background:
        radial-gradient(900px 500px at 10% -10%,rgba(242,138,60,.08),transparent 60%),
        var(--bg);
    }
    button,input{font:inherit}
    .wrap{width:min(1160px,calc(100% - 24px));margin:auto;padding:28px 0 38px}
    header{margin-bottom:18px}
    .eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.12em}
    h1{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;margin:7px 0 7px;font-size:clamp(27px,4vw,42px);letter-spacing:-.04em}
    .sub{margin:0;color:var(--muted);font-size:13px;line-height:1.7}

    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
    .card{background:linear-gradient(180deg,#171a1d,#121518);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .chart-card{padding:14px}
    .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .chart-head span:first-child{font-size:12px;color:var(--muted)}
    .slot{font-size:12px;color:var(--accent);font-weight:800}
    .canvas-wrap{position:relative;aspect-ratio:1.45/1;min-height:420px;background:#111416;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    canvas{width:100%;height:100%;display:block;touch-action:none;cursor:default}

    .side{display:grid;gap:14px}
    .input-card{padding:16px}
    .label{font-size:12px;color:var(--muted);margin-bottom:8px}
    .p9-input{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px}
    .fixed-x{height:46px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#0f1214;color:#aeb6bd;font-size:13px;white-space:nowrap}
    .ybox{height:46px;display:flex;align-items:center;border:1px solid rgba(242,138,60,.58);border-radius:10px;background:#0f1214;overflow:hidden;box-shadow:0 0 0 3px rgba(242,138,60,.05)}
    .ybox span{padding-left:12px;color:#aeb6bd;font-size:13px}
    .ybox input{width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--gold);font-weight:900;text-align:right;padding:0 12px;font-size:16px;min-width:0}
    .hint{margin-top:8px;color:#707a82;font-size:11px;line-height:1.55}

    .result-card{padding:12px}
    .result-title{display:flex;justify-content:space-between;align-items:center;padding:3px 2px 10px;font-size:12px;color:var(--muted)}
    .rows{display:grid;gap:6px}
    .row{display:grid;grid-template-columns:36px 1fr 1fr;gap:6px;align-items:center}
    .point{font-weight:900;font-size:13px}
    .value{height:38px;border:1px solid var(--line);border-radius:8px;background:#0f1214;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:12px;color:#8f989f}
    .value strong{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
    .row.p9 .point{color:var(--accent)}
    .row.p9 .value{border-color:rgba(242,138,60,.38)}
    .row.p10{opacity:.82}
    .row.p10 .value strong{color:#d7dde1}
    .divider{height:1px;background:var(--line);margin:4px 0}
    .fixed-note{margin-top:10px;color:#707a82;font-size:10.5px;line-height:1.5}

    @media(max-width:820px){
      .layout{grid-template-columns:1fr}
      .side{grid-template-columns:1fr}
      .canvas-wrap{min-height:340px}
    }
    @media(max-width:520px){
      .wrap{width:min(100% - 14px,1160px);padding-top:18px}
      .chart-card{padding:8px}
      .input-card{padding:13px}
      .result-card{padding:9px}
      .canvas-wrap{min-height:310px;aspect-ratio:1/1}
      .p9-input{grid-template-columns:1fr}
      .fixed-x{height:42px}
      .ybox{height:46px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">P9 LINEAR CURVE</div>
      <h1>SuiOvOi Control スティックカーブ</h1>
      <p class="sub">P9 の Y 値だけ指定。P1〜P9 を一直線になるよう自動計算します。</p>
    </header>

    <div class="layout">
      <section class="card chart-card">
        <div class="chart-head">
          <span>X / Y AXIS · 0–100</span>
          <span class="slot">P9 X=99.8 / P10=99.9,100 固定</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="curveCanvas" width="900" height="620"></canvas>
        </div>
      </section>

      <aside class="side">
        <section class="card input-card">
          <div class="label">P9 の Y 値</div>
          <div class="p9-input">
            <div class="fixed-x">X&nbsp;&nbsp;<strong>99.8</strong></div>
            <label class="ybox" aria-label="P9 Y value">
              <span>Y</span>
              <input id="p9y" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="53.5" />
            </label>
          </div>
          <div class="hint">数値入力またはグラフ上の P9 を上下にドラッグすると、P1〜P9 がリアルタイムで再計算されます。</div>
        </section>

        <section class="card result-card">
          <div class="result-title"><span>計算結果</span><span>P1 → P9 LINEAR</span></div>
          <div id="rows" class="rows"></div>
          <div class="fixed-note">P1〜P9 は原点 (0,0) から P9 (99.8, 指定Y) までの同一直線上。P10 は X=99.9 / Y=100.0 固定です。</div>
        </section>
      </aside>
    </div>
  </div>

<script>
(() => {
  const P9_X = 99.8;
  const P10 = { x: 99.9, y: 100.0 };
  const input = document.getElementById('p9y');
  const rowsEl = document.getElementById('rows');
  const canvas = document.getElementById('curveCanvas');
  const ctx = canvas.getContext('2d');
  let draggingP9 = false;

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const fmt = (n) => Number(n).toFixed(1);


  function getChartGeometry() {
    const rect = canvas.getBoundingClientRect();
    const W = Math.max(360, Math.round(rect.width));
    const H = Math.max(300, Math.round(rect.height));
    const pad = { l:58, r:42, t:36, b:52 };
    const cw = W - pad.l - pad.r;
    const ch = H - pad.t - pad.b;
    return {
      rect, W, H, pad, cw, ch,
      X: v => pad.l + (v/100) * cw,
      Y: v => pad.t + ch - (v/100) * ch
    };
  }

  function pointerPosition(e) {
    const g = getChartGeometry();
    return {
      g,
      x: e.clientX - g.rect.left,
      y: e.clientY - g.rect.top
    };
  }

  function isNearP9(e) {
    const {g, x, y} = pointerPosition(e);
    let p9y = Number(input.value);
    if (!Number.isFinite(p9y)) p9y = 53.5;
    p9y = clamp(p9y, 0, 100);
    const px = g.X(P9_X);
    const py = g.Y(p9y);
    return Math.hypot(x - px, y - py) <= 24;
  }

  function setP9YFromPointer(e) {
    const {g, y} = pointerPosition(e);
    const raw = ((g.pad.t + g.ch - y) / g.ch) * 100;
    const value = Math.round(clamp(raw, 0, 100) * 10) / 10;
    input.value = fmt(value);
    update();
  }

  // XはP9=99.8を9等分し、各点を小数1桁に丸める。
  // Yは「丸めたX」が原点→P9の直線上に来るよう傾きから計算する。
  function calculate(p9y) {
    const slope = p9y / P9_X;
    const points = [];
    for (let i = 1; i <= 9; i++) {
      const x = i === 9 ? P9_X : Number((P9_X * i / 9).toFixed(1));
      const y = i === 9 ? p9y : Number((x * slope).toFixed(1));
      points.push({ p:i, x, y });
    }
    points.push({ p:10, x:P10.x, y:P10.y, fixed:true });
    return points;
  }

  function renderRows(points) {
    rowsEl.innerHTML = points.map((pt, idx) => {
      const cls = pt.p === 9 ? 'row p9' : pt.p === 10 ? 'row p10' : 'row';
      const divider = pt.p === 10 ? '<div class="divider" style="grid-column:1/-1"></div>' : '';
      return `${divider}<div class="${cls}">
        <div class="point">P${pt.p}</div>
        <div class="value"><span>X</span><strong>${fmt(pt.x)}</strong></div>
        <div class="value"><span>Y</span><strong>${fmt(pt.y)}</strong></div>
      </div>`;
    }).join('');
  }

  function draw(points) {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    const W = Math.max(360, Math.round(rect.width));
    const H = Math.max(300, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    const pad = { l:58, r:42, t:36, b:52 };
    const cw = W - pad.l - pad.r;
    const ch = H - pad.t - pad.b;
    const X = v => pad.l + (v/100) * cw;
    const Y = v => pad.t + ch - (v/100) * ch;

    ctx.lineWidth = 1;
    ctx.strokeStyle = '#24292e';
    ctx.fillStyle = '#7f878e';
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let v=0; v<=100; v+=20) {
      ctx.beginPath(); ctx.moveTo(X(v),Y(0)); ctx.lineTo(X(v),Y(100)); ctx.stroke();
      ctx.fillText(String(v), X(v), Y(0)+12);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let v=0; v<=100; v+=20) {
      ctx.beginPath(); ctx.moveTo(X(0),Y(v)); ctx.lineTo(X(100),Y(v)); ctx.stroke();
      ctx.fillText(String(v), X(0)-12, Y(v));
    }

    ctx.strokeStyle = '#626970';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(100),Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(0),Y(100)); ctx.stroke();

    ctx.fillStyle = '#8f969c';
    ctx.font = 'bold 14px ui-monospace, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Y', X(0)-5, Y(100)-18);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('X', X(100)+22, Y(0)-7);

    const linear = points.slice(0,9);
    ctx.strokeStyle = '#f28a3c';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(X(0),Y(0));
    linear.forEach(pt => ctx.lineTo(X(pt.x),Y(pt.y)));
    ctx.stroke();

    // P9→P10は固定区間なので、リニア区間と区別して細く描画。
    ctx.strokeStyle = '#7c858d';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(X(points[8].x),Y(points[8].y));
    ctx.lineTo(X(P10.x),Y(P10.y));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = 'bold 13px ui-monospace, monospace';
    linear.forEach((pt) => {
      const px=X(pt.x), py=Y(pt.y);
      ctx.fillStyle='#e5b544';
      ctx.strokeStyle='#0b0d0f';
      ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2); ctx.stroke(); ctx.fill();

      ctx.fillStyle='#e7ebee';
      ctx.textAlign='center';
      ctx.textBaseline='bottom';
      const yOffset = pt.p === 9 ? 13 : 11;
      ctx.fillText('P'+pt.p, px, py-yOffset);
    });

    const p10=points[9];
    const px=X(p10.x), py=Y(p10.y);
    ctx.fillStyle='#a9b0b6';
    ctx.strokeStyle='#0b0d0f';
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2); ctx.stroke(); ctx.fill();
    ctx.fillStyle='#dfe3e6';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('P10', px, py+13);

    ctx.fillStyle='#8e969d';
    ctx.strokeStyle='#0b0d0f';
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(X(0),Y(0),7,0,Math.PI*2); ctx.stroke(); ctx.fill();
  }

  function update() {
    let y = Number(input.value);
    if (!Number.isFinite(y)) y = 53.5;
    y = clamp(y,0,100);
    const points = calculate(y);
    renderRows(points);
    draw(points);
  }


  canvas.addEventListener('pointerdown', (e) => {
    if (!isNearP9(e)) return;
    draggingP9 = true;
    canvas.setPointerCapture?.(e.pointerId);
    canvas.style.cursor = 'ns-resize';
    setP9YFromPointer(e);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (draggingP9) {
      setP9YFromPointer(e);
      canvas.style.cursor = 'ns-resize';
      e.preventDefault();
      return;
    }
    canvas.style.cursor = isNearP9(e) ? 'ns-resize' : 'default';
  });

  const stopDragging = (e) => {
    if (!draggingP9) return;
    draggingP9 = false;
    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
    canvas.style.cursor = isNearP9(e) ? 'ns-resize' : 'default';
  };
  canvas.addEventListener('pointerup', stopDragging);
  canvas.addEventListener('pointercancel', stopDragging);
  canvas.addEventListener('pointerleave', (e) => {
    if (!draggingP9) canvas.style.cursor = 'default';
  });

  input.addEventListener('input', update);
  input.addEventListener('change', () => {
    let y = Number(input.value);
    if (!Number.isFinite(y)) y = 53.5;
    y = clamp(y,0,100);
    input.value = fmt(y);
    update();
  });
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
